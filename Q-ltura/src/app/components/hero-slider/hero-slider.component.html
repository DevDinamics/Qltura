<!-- La clase dinámica pinta todo de Naranja (Qualtop) o Lila (SYE) -->
<section class="hero-slider-section" [ngClass]="currentCompany">
  
  <div class="hero-container" *ngIf="slides.length > 0">
    
    <!-- Botón Navegación Izquierda -->
    <button 
      *ngIf="slides.length > 1"
      type="button"
      class="nav-btn prev-btn desktop-only" 
      (click)="prevSlide()" 
      aria-label="Anterior slide">
      <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon>
    </button>

    <!-- Card Principal Glass/Minimalist -->
    <article 
      class="hero-card" 
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)">
      
      <!-- Fondo de Luz Ambiental Estilo Apple Mesh -->
      <div class="ambient-mesh-glow"></div>

      <!-- 1. Contenido de Texto -->
      <div class="hero-content">
        
        <div class="meta-row">
          <span class="hero-tag" *ngIf="currentSlide.tag">
            {{ currentSlide.tag }}
          </span>
          
          <span 
            *ngIf="currentSlide.badgeCompany" 
            class="company-pill">
            {{ currentSlide.badgeCompany }}
          </span>
        </div>

        <h1 class="hero-title">
          {{ currentSlide.title }} 
          <span class="accent-text" *ngIf="currentSlide.highlightText">
            <br>
            {{ currentSlide.highlightText }}
          </span>
        </h1>
        
        <p class="hero-description" *ngIf="currentSlide.description">
          {{ currentSlide.description }}
        </p>

        <button 
          class="hero-cta" 
          type="button"
          [routerLink]="currentSlide.buttonUrl"
          *ngIf="currentSlide.buttonText">
          <span>{{ currentSlide.buttonText }}</span>
          <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </button>
      </div>

      <!-- 2. Ilustración / Foto de Portada -->
      <div class="hero-media">
        <div class="image-stage">
          <img 
            [src]="currentSlide.imageSrc" 
            [alt]="currentSlide.imageAlt || 'Ilustración del slide'" 
            class="slide-img"
            loading="eager"
            decoding="async" />
        </div>
      </div>

      <!-- 3. Paginador de Indicadores -->
      <nav class="hero-pagination" aria-label="Navegación de diapositivas" *ngIf="slides.length > 1">
        <button 
          *ngFor="let slide of slides; let i = index" 
          type="button"
          class="dot-pill" 
          [class.active]="i === currentIndex"
          [attr.aria-label]="'Ir a la diapositiva ' + (i + 1)"
          (click)="goToSlide(i)">
        </button>
      </nav>

    </article>

    <!-- Botón Navegación Derecha -->
    <button 
      *ngIf="slides.length > 1"
      type="button"
      class="nav-btn next-btn desktop-only" 
      (click)="nextSlide()" 
      aria-label="Siguiente slide">
      <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </button>

  </div>
</section>
