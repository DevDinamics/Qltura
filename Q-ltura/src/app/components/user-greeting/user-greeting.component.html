<section 
  class="greeting-hero" 
  [ngClass]="company ? company.toLowerCase() : 'qualtop'">
  
  <div class="greeting-wrapper">
    
    <!-- Bloque de Texto (Izquierda) -->
    <div class="greeting-content">
      
      <!-- Eyebrow: Fecha y Saludo Personalizado -->
      <div class="greeting-eyebrow">
        <time [attr.datetime]="formattedDate">{{ formattedDate }}</time>
        <span class="eyebrow-separator">•</span>
        <span class="salute-pill">{{ greetingPrefix }}, <strong class="highlight-user">{{ userName }}</strong></span>
      </div>

      <!-- Titular Principal Oficial -->
      <h1 class="greeting-headline">
        Tu espacio, nuestra cultura. <span class="highlight">Bienvenido a Q-ltura.</span>
      </h1>

      <!-- Subtítulo Oficial -->
      <p class="greeting-subtext">
        El punto de encuentro donde conectamos equipos, celebramos logros y construimos nuestro entorno de trabajo día a día.
      </p>

      <!-- Botones de Acción (CTAs) -->
      <div class="hero-actions">
        <button type="button" class="btn-cta primary" (click)="scrollToFeed()">
          <ion-icon name="newspaper-outline"></ion-icon>
          <span>Explorar Novedades</span>
        </button>

        <button type="button" class="btn-cta secondary" (click)="goToMiEspacio()">
          <ion-icon name="person-circle-outline"></ion-icon>
          <span>Mi Espacio</span>
        </button>
      </div>

    </div>

    <!-- Ícono Minimalista Flotante (Derecha) -->
    <div class="scenic-icon-box" [ngClass]="timePeriod" aria-hidden="true">
      
      <!-- MAÑANA: Ícono de Amanecer -->
      <ion-icon name="partly-sunny-outline" class="time-icon morning-icon" *ngIf="timePeriod === 'morning'"></ion-icon>

      <!-- TARDE: Ícono de Sol radiante -->
      <ion-icon name="sunny-outline" class="time-icon afternoon-icon" *ngIf="timePeriod === 'afternoon'"></ion-icon>

      <!-- NOCHE: Ícono de Luna y Estrellas -->
      <ion-icon name="moon-outline" class="time-icon night-icon" *ngIf="timePeriod === 'night'"></ion-icon>

    </div>

  </div>

</section>
