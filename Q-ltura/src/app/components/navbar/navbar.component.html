<!-- HEADER SUPERIOR -->
<ion-header class="ion-no-border">
  <ion-toolbar>
    <div class="navbar-wrapper">
      
      <!-- CONTENEDOR IZQUIERDO: Logo Q-ltura y Menú Desktop -->
      <div class="nav-left">
        <div class="logo-section" [routerLink]="['/home']" aria-label="Ir a Inicio Q-ltura">
          <div class="q-logo-mark">
            <span class="q-letter">Q</span>
          </div>
          <span class="brand-title">ltura</span>
        </div>

        <nav class="nav-links desktop-only" aria-label="Navegación principal">
          <ul>
            <li *ngFor="let item of navItems">
              <a 
                [routerLink]="[item.route]"
                routerLinkActive="active"
                [routerLinkActiveOptions]="{ exact: false }">
                {{ item.label }}
              </a>
            </li>
          </ul>
        </nav>
      </div>

      <!-- ACCIONES DERECHA -->
      <div class="nav-actions">
        <!-- BUSCADOR CON ACCIÓN ASIGNADA -->
        <button 
          type="button"
          class="action-btn desktop-only" 
          (click)="openSearch()" 
          aria-label="Buscar plataformas y contenidos">
          <ion-icon name="search-outline"></ion-icon>
        </button>

        <!-- BOTÓN DE NOTIFICACIONES CON CONTADOR NUMÉRICO -->
        <button 
          type="button"
          class="action-btn notification-btn" 
          [class.bell-ring]="hasNewIncomingNotification"
          (click)="openPopover($event)"
          aria-label="Notificaciones">
          <ion-icon [name]="unreadCount > 0 ? 'notifications' : 'notifications-outline'"></ion-icon>
          
          <span class="notification-badge" *ngIf="unreadCount > 0">
            {{ unreadCount > 9 ? '9+' : unreadCount }}
            <span class="pulse-ring"></span>
          </span>
        </button>

        <!-- ÁREA DE USUARIO: AVATAR + NOMBRE + FLECHA DESPLEGABLE -->
        <div 
          class="user-profile-trigger" 
          (click)="openUserPopover($event)"
          role="button"
          tabindex="0"
          aria-label="Menú de cuenta de usuario">
          
          <div 
            class="user-avatar" 
            [ngClass]="user.company ? user.company.toLowerCase() : 'qualtop'">
            <img [src]="user.avatar" [alt]="user.name" />
          </div>

          <div class="user-meta desktop-only">
            <span class="user-name">{{ user.name }}</span>
            <ion-icon name="chevron-down-outline" class="user-chevron"></ion-icon>
          </div>
        </div>

        <!-- POPOVER 1: NOTIFICACIONES (APPLE GLASS) -->
        <ion-popover 
          [isOpen]="isPopoverOpen" 
          [event]="popoverEvent"
          (didDismiss)="onPopoverDismiss()"
          side="bottom" 
          alignment="end" 
          mode="ios"
          class="custom-notif-popover">
          <ng-template>
            <div class="notif-dropdown-content">
              
              <div class="notif-header">
                <div class="notif-title-row">
                  <h3>Notificaciones</h3>
                  <span class="unread-count-pill" *ngIf="unreadCount > 0">{{ unreadCount }} nuevas</span>
                  <span class="all-caught-up-pill" *ngIf="unreadCount === 0">Al día</span>
                </div>
                
                <button 
                  type="button" 
                  class="mark-read-btn" 
                  *ngIf="unreadCount > 0"
                  (click)="markAllAsRead()">
                  <ion-icon name="checkmark-done-outline"></ion-icon>
                  <span>Leer todas</span>
                </button>
              </div>

              <!-- Lista de notificaciones -->
              <div class="notif-list">
                <div 
                  *ngFor="let item of notificationsList" 
                  class="notif-item" 
                  [class.unread]="item.unread"
                  (click)="onNotificationClick(item)">
                  
                  <div class="notif-icon-box" [ngClass]="item.type">
                    <ion-icon *ngIf="item.type === 'birthday'" name="gift-outline"></ion-icon>
                    <ion-icon *ngIf="item.type === 'tech'" name="sparkles-outline"></ion-icon>
                    <ion-icon *ngIf="item.type === 'official'" name="calendar-outline"></ion-icon>
                  </div>

                  <div class="notif-body">
                    <p class="notif-text">{{ item.title }}</p>
                    <span class="notif-time">{{ item.time }}</span>
                  </div>

                  <span class="unread-dot" *ngIf="item.unread"></span>
                </div>

                <div class="empty-notif" *ngIf="notificationsList.length === 0">
                  <ion-icon name="notifications-off-outline"></ion-icon>
                  <p>No tienes notificaciones pendientes</p>
                </div>
              </div>

              <div class="notif-footer">
                <a [routerLink]="['/avisos']" (click)="isPopoverOpen = false">Ver todo el calendario →</a>
              </div>

            </div>
          </ng-template>
        </ion-popover>

        <!-- POPOVER 2: MENÚ DESPLEGABLE DE USUARIO -->
        <ion-popover 
          [isOpen]="isUserPopoverOpen" 
          [event]="userPopoverEvent"
          (didDismiss)="isUserPopoverOpen = false"
          side="bottom" 
          alignment="end" 
          mode="ios"
          class="custom-user-popover">
          <ng-template>
            <div class="user-dropdown-content">
              
              <!-- Resumen del Usuario -->
              <div class="user-dropdown-header">
                <div class="user-avatar-lg">
                  <img [src]="user.avatar" [alt]="user.name" />
                </div>
                <div class="user-details">
                  <h4 class="name">{{ user.name }}</h4>
                  <p class="role">{{ user.role }} • {{ user.department }}</p>
                  <span class="company-tag" [ngClass]="user.company ? user.company.toLowerCase() : 'qualtop'">
                    {{ user.company }}
                  </span>
                </div>
              </div>

              <div class="dropdown-divider"></div>

              <!-- Enlaces Rápidos -->
              <nav class="user-dropdown-links">
                <button type="button" class="menu-link-btn" (click)="navigateTo('/mas')">
                  <div class="link-icon">
                    <ion-icon name="person-circle-outline"></ion-icon>
                  </div>
                  <span>Mi Espacio / Perfil</span>
                </button>

                <button type="button" class="menu-link-btn" (click)="navigateTo('/denuncia')">
                  <div class="link-icon">
                    <ion-icon name="shield-checkmark-outline"></ion-icon>
                  </div>
                  <span>Línea de Ética & Denuncia</span>
                </button>
              </nav>

              <div class="dropdown-divider"></div>

              <!-- Cerrar Sesión (con Alerta de Confirmación) -->
              <div class="user-dropdown-footer">
                <button type="button" class="logout-menu-btn" (click)="confirmLogout()">
                  <ion-icon name="log-out-outline"></ion-icon>
                  <span>Cerrar Sesión</span>
                </button>
              </div>

            </div>
          </ng-template>
        </ion-popover>

      </div>

    </div>
  </ion-toolbar>
</ion-header>

<!-- BOTTOM TAB BAR MÓVIL RESPONSIVO -->
<ion-tab-bar slot="bottom" class="mobile-only custom-tab-bar">
  <ion-tab-button 
    *ngFor="let tab of mobileTabs" 
    [routerLink]="[tab.route]"
    routerLinkActive="tab-selected"
    [routerLinkActiveOptions]="{ exact: false }">
    <ion-icon [name]="tab.icon"></ion-icon>
    <ion-label>{{ tab.label }}</ion-label>
  </ion-tab-button>
</ion-tab-bar>
