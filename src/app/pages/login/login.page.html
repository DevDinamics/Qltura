<ion-content class="login-content-wrapper" [fullscreen]="true">
  
  <!-- ORBES DE LUZ -->
  <div class="ambient-glow glow-orange"></div>
  <div class="ambient-glow glow-blue"></div>
  <div class="ambient-glow glow-amber"></div>

  <!-- PATRONES GEOMÉTRICOS -->
  <div class="tech-bg-patterns">
    <div class="geo-pattern pattern-dots-top-left"></div>
    <div class="geo-pattern pattern-dots-bottom-right"></div>
    
    <!-- Figuras decorativas -->
    <span class="shape shape-cross cross-1">+</span>
    <span class="shape shape-cross cross-2">+</span>
    <span class="shape shape-triangle triangle-1">▲</span>
    <span class="shape shape-triangle triangle-2">▲</span>
    <div class="shape shape-circle-ring ring-1"></div>
  </div>

  <div class="login-viewport">
    
    <!-- Branding Header -->
    <header class="brand-header">
      <div class="logo-wrapper">
        <img src="assets/Logotipo_/SI_logotipo_color-03.svg" alt="Software Innovators" class="brand-logo" />
      </div>
      <h1 class="portal-title">Q-ltura Portal</h1>
      <p class="portal-tagline">Conectando talento, cultura e innovación</p>
    </header>

    <!-- Glassmorphism Login Card -->
    <main class="login-card">
      <form (ngSubmit)="onLogin()" class="login-form">
        
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <div class="input-field">
            <ion-icon name="mail-outline" class="field-icon"></ion-icon>
            <input 
              id="email"
              type="email" 
              [(ngModel)]="email" 
              name="email" 
              placeholder="nombre@empresa.com" 
              (input)="onEmailChange()"
              required />
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-field">
            <ion-icon name="lock-closed-outline" class="field-icon"></ion-icon>
            <input 
              id="password"
              type="password" 
              [(ngModel)]="password" 
              name="password" 
              placeholder="••••••••" 
              required />
          </div>
        </div>

        <!-- Selector de Empresa -->
        <div class="form-group company-group" *ngIf="showCompanySelector">
          <div class="company-header-row">
            <label>Empresa asignada</label>
            <span class="company-hint">Selecciona tu filial</span>
          </div>

          <div class="company-pills">
            <button 
              type="button" 
              class="pill-btn qualtop"
              [class.active]="selectedCompany === 'Qualtop'"
              (click)="selectedCompany = 'Qualtop'">
              <ion-icon name="business-outline"></ion-icon>
              <span>Qualtop</span>
            </button>
            
            <button 
              type="button" 
              class="pill-btn sye"
              [class.active]="selectedCompany === 'SYE'"
              (click)="selectedCompany = 'SYE'">
              <ion-icon name="business-outline"></ion-icon>
              <span>SYE</span>
            </button>
          </div>
        </div>

        <button type="submit" class="cta-submit-btn" [disabled]="isLoading">
          <span *ngIf="!isLoading">Ingresar al portal</span>
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <ion-icon *ngIf="!isLoading" name="arrow-forward-outline"></ion-icon>
        </button>

        <div class="form-divider">
          <span>o accede con</span>
        </div>

        <button type="button" class="google-workspace-btn" (click)="loginWithGoogle()">
          <ion-icon name="logo-google"></ion-icon>
          <span>Continuar con Google</span>
        </button>

      </form>

      <!-- SECCIÓN ACCESO RÁPIDO PARA DEMO -->
      <div class="demo-access-section">
        <div class="demo-divider">
          <span>Acceso Rápido Demo</span>
        </div>

        <p class="demo-hint">Selecciona un perfil de prueba para explorar la plataforma:</p>

        <div class="demo-buttons-grid">
          <button 
            type="button" 
            class="demo-card-btn qualtop"
            (click)="quickDemoLogin('demo-qualtop-01')">
            <img src="https://i.pravatar.cc/150?img=32" alt="Ana López" class="demo-avatar" />
            <div class="demo-info">
              <span class="demo-name">Ana López</span>
              <span class="demo-company-tag qualtop">Qualtop • TI</span>
            </div>
          </button>

          <button 
            type="button" 
            class="demo-card-btn sye"
            (click)="quickDemoLogin('demo-sye-02')">
            <img src="https://i.pravatar.cc/150?img=11" alt="Carlos Mendoza" class="demo-avatar" />
            <div class="demo-info">
              <span class="demo-name">Carlos Mendoza</span>
              <span class="demo-company-tag sye">SYE • Operaciones</span>
            </div>
          </button>
        </div>
      </div>

    </main>

    <footer class="login-footer">
      <p>© 2026 Q-ltura • Todos los derechos reservados</p>
    </footer>

  </div>
</ion-content>
